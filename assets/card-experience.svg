<svg width="960" height="560" viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: 'Inter', -apple-system, sans-serif; font-size: 24px; font-weight: 700; fill: #ffffff; }
      .company { font-family: 'Inter', -apple-system, sans-serif; font-size: 18px; font-weight: 600; fill: #ffffff; }
      .role { font-family: 'Inter', -apple-system, sans-serif; font-size: 14px; font-weight: 400; fill: #64748b; }
      .bullet { font-family: 'Inter', -apple-system, sans-serif; font-size: 14px; font-weight: 400; fill: #cbd5e1; }
      .glow { filter: drop-shadow(0 0 8px rgba(0, 242, 254, 0.6)); }
    </style>
    
    <!-- Background gradient -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02040a" />
      <stop offset="100%" stop-color="#080e1c" />
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>

  <!-- Card Background -->
  <rect width="958" height="558" x="1" y="1" fill="url(#bgGlow)" rx="12" stroke="rgba(255,255,255,0.05)" stroke-width="1" />
  
  <!-- Subtle top highlight line -->
  <rect width="960" height="1" x="0" y="0" fill="url(#lineGrad)" opacity="0.3" />

  <!-- Section Title -->
  <g transform="translate(40, 40)">
    <!-- Animated pulsing dot next to title -->
    <circle cx="6" cy="-6" r="4" fill="#00f2fe" class="glow">
      <animate attributeName="opacity" values="0.4; 1; 0.4" dur="3s" repeatCount="indefinite" />
    </circle>
    <text x="24" y="0" class="title" letter-spacing="1">Experience</text>
  </g>

  <!-- Timeline Base Line -->
  <line x1="60" y1="90" x2="60" y2="510" stroke="#1e293b" stroke-width="2" />
  
  <!-- Animated Timeline Pulse -->
  <line x1="60" y1="90" x2="60" y2="140" stroke="#00f2fe" stroke-width="2" class="glow">
    <animate attributeName="y1" values="70; 500; 70" dur="5s" repeatCount="indefinite" />
    <animate attributeName="y2" values="120; 550; 120" dur="5s" repeatCount="indefinite" />
  </line>

  <!-- ================= AMAZON SECTION ================= -->
  <g transform="translate(60, 95)">
    <!-- Node -->
    <circle cx="0" cy="0" r="6" fill="#02040a" stroke="#ff9900" stroke-width="2" class="glow" />
    <circle cx="0" cy="0" r="2" fill="#ff9900" />

    <!-- Header -->
    <text x="30" y="5" class="company">Amazon</text>
    <text x="105" y="4" class="role">— Software Development Engineer · Bangalore · Jul 2026 – Present</text>

    <!-- Bullets -->
    <g transform="translate(30, 32)">
      <circle cx="0" cy="-4" r="2" fill="#475569" />
      <text x="12" y="0" class="bullet">Real-time alert ingestion &amp; signal processing for network outages and major incidents (LEO Team)</text>
      
      <circle cx="0" cy="24" r="2" fill="#475569" />
      <text x="12" y="28" class="bullet">Automated workflow approvals, incident signal analysis, and operational dashboarding</text>
      
      <circle cx="0" cy="52" r="2" fill="#475569" />
      <text x="12" y="56" class="bullet">Active &amp; proactive multi-channel customer notification engines (email &amp; mobile)</text>
    </g>
  </g>

  <!-- ================= VISA INC SECTION ================= -->
  <g transform="translate(60, 245)">
    <!-- Node -->
    <circle cx="0" cy="0" r="6" fill="#02040a" stroke="#00f2fe" stroke-width="2" class="glow" />
    <circle cx="0" cy="0" r="2" fill="#00f2fe" />

    <!-- Header -->
    <text x="30" y="5" class="company">Visa Inc.</text>
    <text x="110" y="4" class="role">— Software Engineer · Bangalore · Jun 2025 – Jul 2026</text>

    <!-- Bullets -->
    <g transform="translate(30, 32)">
      <circle cx="0" cy="-4" r="2" fill="#475569" />
      <text x="12" y="0" class="bullet">Kafka-driven onboarding microservices in Java &amp; Spring Boot; reverse-engineered 15K+ lines of SQL</text>
      
      <circle cx="0" cy="24" r="2" fill="#475569" />
      <text x="12" y="28" class="bullet">Zero-downtime dual-write migration framework for seamless database schema evolution</text>
      
      <circle cx="0" cy="52" r="2" fill="#475569" />
      <text x="12" y="56" class="bullet">Auth Relay microservice with SDS encryption &amp; automated test platform (~100 integration tests)</text>
    </g>
  </g>

  <!-- ================= CRED SECTION ================= -->
  <g transform="translate(60, 395)">
    <!-- Node -->
    <circle cx="0" cy="0" r="6" fill="#02040a" stroke="#4facfe" stroke-width="2" class="glow" />
    <circle cx="0" cy="0" r="2" fill="#4facfe" />

    <!-- Header -->
    <text x="30" y="5" class="company">CRED</text>
    <text x="85" y="4" class="role">— Backend Engineer Intern · Bangalore · Jan 2025 – Jun 2025</text>

    <!-- Bullets -->
    <g transform="translate(30, 32)">
      <circle cx="0" cy="-4" r="2" fill="#475569" />
      <text x="12" y="0" class="bullet">Centralized metric publishing library cutting instrumentation effort by 87.5% across backend teams</text>
      
      <circle cx="0" cy="24" r="2" fill="#475569" />
      <text x="12" y="28" class="bullet">Core loan engine validations &amp; DB constraints eliminating 2,000+ erroneous transitions/month</text>
      
      <circle cx="0" cy="52" r="2" fill="#475569" />
      <text x="12" y="56" class="bullet">Python financial recalculation pipelines (10K+ users) and AML-compliant multi-rail payment flows</text>
    </g>
  </g>
</svg>
